# DevSecOps bonus: GitHub CodeQL static analysis.
# Findings appear under the repo's "Security" tab → Code scanning.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1" # weekly, Monday 03:17 UTC

permissions:
  contents: read

jobs:
  analyze:
    name: 🛡️ CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: python
          build-mode: none

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"
