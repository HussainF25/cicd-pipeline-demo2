<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CI/CD Demo v{{ info.version }}</title>
  <style>
    :root { --bg:#0f172a; --card:#1e293b; --text:#e2e8f0; --muted:#94a3b8; --accent:#38bdf8; --ok:#4ade80; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
           background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; padding:24px; }
    .card { background:var(--card); border-radius:16px; padding:40px; max-width:760px; width:100%;
            box-shadow:0 20px 50px rgba(0,0,0,.4); }
    .env { display:inline-block; padding:4px 12px; border-radius:999px; background:rgba(74,222,128,.15);
           color:var(--ok); font-size:13px; font-weight:600; letter-spacing:.05em; text-transform:uppercase; }
    h1 { font-size:34px; margin:18px 0 8px; line-height:1.2; }
    .version { font-size:64px; font-weight:800; color:var(--accent); margin:8px 0 24px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; margin-bottom:28px; }
    .item { background:rgba(255,255,255,.04); border-radius:10px; padding:12px 14px; }
    .label { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.05em; }
    .value { font-family:ui-monospace,Menlo,monospace; font-size:14px; margin-top:4px; word-break:break-all; }
    .flow { display:flex; flex-wrap:wrap; gap:6px; align-items:center; color:var(--muted); font-size:13px; }
    .flow span { background:rgba(56,189,248,.12); color:var(--accent); padding:4px 10px; border-radius:6px; }
  </style>
</head>
<body>
  <main class="card">
    <span class="env">● {{ environment }}</span>
    <h1>{{ message }}</h1>
    <div class="version">v{{ info.version }}</div>
    <div class="grid">
      <div class="item"><div class="label">Build #</div><div class="value">{{ info.build_number }}</div></div>
      <div class="item"><div class="label">Commit</div><div class="value">{{ info.commit[:7] }}</div></div>
      <div class="item"><div class="label">Built at (UTC)</div><div class="value">{{ info.built_at }}</div></div>
    </div>
    <div class="flow">
      <span>git push</span>→<span>security scan</span>→<span>unit tests</span>→<span>build</span>→<span>S3</span>→<span>EC2 deploy</span>→<span>live ✓</span>
    </div>
  </main>
</body>
</html>
